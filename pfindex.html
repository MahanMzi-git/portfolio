<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahan Mizani — Software Engineer</title>
<style>
  :root{
    --bg:#05070c;
    --panel:#0a0e17;
    --panel-border:#1a2436;
    --blue:#2f7bff;
    --blue-bright:#4da3ff;
    --text:#eef2f8;
    --muted:#93a1b8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#000; color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;}

  body{
    padding: 32px 24px 60px;
    background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(30,90,220,0.35), transparent 70%);
  }

  .frame{
    max-width: 1400px;
    margin: 0 auto;
    border-radius: 28px;
    overflow: hidden;
  }

  .hero{
    background: radial-gradient(1200px 600px at 78% 20%, rgba(35,60,120,0.35), transparent 60%), #05070c;
    padding: 40px 56px 64px;
  }

  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 90px;
    flex-wrap: wrap;
    gap: 20px;
  }

  .logo{ font-size: 22px; font-weight: 700; }
  .logo .dot{ color: var(--blue-bright); }

  .nav-links{
    display:flex;
    gap: 36px;
    list-style:none;
    color: var(--muted);
    font-size: 15px;
  }
  .nav-links a{ color: inherit; text-decoration:none; }
  .nav-links a.active{ color: var(--blue-bright); }

  .cv-btn{
    background: transparent;
    border: 1px solid #2a3958;
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    cursor:pointer;
  }

  .hero-grid{
    display:grid;
    grid-template-columns: 1.05fr 0.95fr;
    align-items:center;
    gap: 40px;
  }

  .eyebrow{ color: var(--blue-bright); font-size: 18px; margin-bottom: 6px; }
  h1.name{ font-size: clamp(38px, 5vw, 58px); font-weight: 800; margin-bottom: 10px; }
  h2.role{ font-size: clamp(24px, 3vw, 32px); font-weight: 700; color: var(--blue-bright); margin-bottom: 22px; }
  p.intro{ color: var(--muted); font-size: 16px; line-height: 1.7; max-width: 480px; margin-bottom: 34px; }

  .cta-row{ display:flex; gap: 16px; margin-bottom: 34px; flex-wrap: wrap; }
  .btn-primary{
    background: linear-gradient(180deg, #2f7bff, #1c5ce0);
    color:#fff; border:none; padding: 15px 26px; border-radius: 10px;
    font-size: 15px; font-weight:600; cursor:pointer;
  }
  .btn-secondary{
    background: transparent; border: 1px solid var(--blue); color: var(--blue-bright);
    padding: 15px 26px; border-radius: 10px; font-size: 15px; font-weight:600; cursor:pointer;
  }

  .social-row{ display:flex; gap:14px; }
  .social-row a{
    width: 44px; height:44px; border-radius:50%;
    border: 1px solid #263452; display:flex; align-items:center; justify-content:center;
    color: var(--blue-bright); text-decoration:none;
  }

  .portrait-wrap{ display:flex; justify-content:center; align-items:center; min-height: 460px; }
  .portrait{
    width: 380px; height: 460px; border-radius: 24px;
    background: radial-gradient(circle at 32% 30%, rgba(60,90,140,0.5), transparent 55%), linear-gradient(160deg, #10151f, #05070c 70%);
    display:flex; align-items:center; justify-content:center;
  }
  .portrait-caption{ color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div class="frame">
    <section class="hero">
      <nav>
        <div class="logo">Mahan<span class="dot">.</span></div>
        <ul class="nav-links">
          <li><a href="#home" class="active">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <button class="cv-btn">Download CV ⭳</button>
      </nav>

      <div class="hero-grid">
        <div>
          <p class="eyebrow">Hi, I'm</p>
          <h1 class="name">Mahan Mizani</h1>
          <h2 class="role">Software Engineer</h2>
          <p class="intro">I build scalable web applications and backend systems. Passionate about clean code, problem solving and turning ideas into real products.</p>
          <div class="cta-row">
            <button class="btn-primary">View My Work →</button>
            <button class="btn-secondary">Let's Talk</button>
          </div>
          <div class="social-row">
            <a href="#" title="GitHub">GH</a>
            <a href="#" title="LinkedIn">in</a>
            <a href="#" title="Email">✉</a>
          </div>
        </div>

        <div class="portrait-wrap">
          <div class="portrait">
            <p class="portrait-caption">Replace with your own photo</p>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
